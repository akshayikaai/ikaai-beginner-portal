version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ikaai_postgres
    restart: always
    environment:
      POSTGRES_USER: ikaai_user
      POSTGRES_PASSWORD: ikaai_password_2026
      POSTGRES_DB: ikaai_academy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ikaai_user -d ikaai_academy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
